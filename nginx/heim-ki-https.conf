# NGINX Reverse Proxy für die Heim-KI — HTTPS-Variante (README §10)
#
# Diese Datei ERSETZT heim-ki.conf (nur eine von beiden aktivieren!).
#
# Vorbereitung — Zertifikat mit mkcert erstellen (README §10):
#   mkcert -install
#   mkcert chat.heim.lan ollama.heim.lan ollama-ws.heim.lan
#   sudo mkdir -p /etc/nginx/certs
#   sudo cp chat.heim.lan+2.pem     /etc/nginx/certs/heim-ki.pem
#   sudo cp chat.heim.lan+2-key.pem /etc/nginx/certs/heim-ki-key.pem
#
# Aktivieren:
#   sudo cp nginx/heim-ki-https.conf /etc/nginx/sites-available/
#   sudo rm -f /etc/nginx/sites-enabled/heim-ki.conf
#   sudo ln -s /etc/nginx/sites-available/heim-ki-https.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Aktivieren (macOS/Homebrew) — Zertifikate und htpasswd liegen hier unter
# /opt/homebrew, NGINX läuft als root (Port 443 ist privilegiert):
#   sudo mkdir -p /opt/homebrew/etc/nginx/certs
#   sudo cp chat.heim.lan+2.pem     /opt/homebrew/etc/nginx/certs/heim-ki.pem
#   sudo cp chat.heim.lan+2-key.pem /opt/homebrew/etc/nginx/certs/heim-ki-key.pem
#   sudo rm -f /opt/homebrew/etc/nginx/servers/heim-ki.conf
#   sudo cp nginx/heim-ki-https.conf /opt/homebrew/etc/nginx/servers/
#   sudo sed -i '' \
#     -e 's|<LAN-CIDR>|192.168.1.0/24|g' \
#     -e 's|/etc/nginx/certs|/opt/homebrew/etc/nginx/certs|g' \
#     -e 's|/etc/nginx/heim-ki.htpasswd|/opt/homebrew/etc/nginx/heim-ki.htpasswd|g' \
#     /opt/homebrew/etc/nginx/servers/heim-ki-https.conf
#   sudo nginx -t && sudo brew services restart nginx
#
# Vorher: <LAN-CIDR> unten durch das eigene Heimnetz ersetzen
# (z. B. 192.168.1.0/24) und die Passwortdatei für die Ollama-vHosts anlegen
# (Paket apache2-utils):
#   sudo htpasswd -c /etc/nginx/heim-ki.htpasswd heim-ki
#   sudo chown root:www-data /etc/nginx/heim-ki.htpasswd
#   sudo chmod 640 /etc/nginx/heim-ki.htpasswd
# macOS: htpasswd bringt das System schon mit (/usr/sbin/htpasswd), eine
# Gruppe www-data gibt es nicht:
#   sudo /usr/sbin/htpasswd -c /opt/homebrew/etc/nginx/heim-ki.htpasswd heim-ki
#   sudo chown root:wheel /opt/homebrew/etc/nginx/heim-ki.htpasswd
#   sudo chmod 600 /opt/homebrew/etc/nginx/heim-ki.htpasswd
#
# Bleibt der Platzhalter stehen, scheitert schon "nginx -t" mit
#   nginx: [emerg] invalid parameter "<LAN-CIDR>"
# und NGINX lädt die ganze Datei nicht — auch den Chat-vHost nicht.

# HTTP -> HTTPS umleiten
server {
    listen 80;
    server_name chat.heim.lan ollama.heim.lan ollama-ws.heim.lan;
    return 301 https://$host$request_uri;
}

# Open WebUI
server {
    listen 443 ssl;
    server_name chat.heim.lan;

    ssl_certificate     /etc/nginx/certs/heim-ki.pem;
    ssl_certificate_key /etc/nginx/certs/heim-ki-key.pem;

    # Dokumenten-Upload (RAG): NGINX-Standardlimit von 1 MB reicht für PDFs nicht
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSockets für den Chat-Stream:
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Ollama API (Docker-Host)
server {
    listen 443 ssl;
    server_name ollama.heim.lan;

    ssl_certificate     /etc/nginx/certs/heim-ki.pem;
    ssl_certificate_key /etc/nginx/certs/heim-ki-key.pem;

    # Ollama bringt KEINE eigene Authentifizierung mit und veröffentlicht
    # Modellverwaltung (/api/pull, /api/delete, /api/push) ohne Nachfrage.
    # satisfy all = erlaubtes Netz UND gültige Credentials sind nötig.
    satisfy all;
    allow <LAN-CIDR>;
    deny  all;
    auth_basic           "Heim-KI Ollama";
    # macOS (Homebrew): Pfad auf /opt/homebrew/etc/nginx/heim-ki.htpasswd anpassen
    auth_basic_user_file /etc/nginx/heim-ki.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:11434;
        # Credentials nicht an Ollama weiterreichen:
        proxy_set_header Authorization "";
        # Ollama lehnt fremde Host-Header je nach Version als Schutz vor
        # DNS-Rebinding ab (403) — deshalb localhost senden, nicht $host.
        # Das hebelt diesen Schutz aus und ist NUR vertretbar, weil die
        # auth_basic oben davorsteht. Wer die Auth entfernt, muss auch
        # diese Zeile entfernen.
        proxy_set_header Host 127.0.0.1:11434;
        proxy_read_timeout 600s;   # große Modelle brauchen Zeit
        proxy_buffering off;       # Token-Streaming
    }
}

# Ollama API (Workstation, on demand)
server {
    listen 443 ssl;
    server_name ollama-ws.heim.lan;

    ssl_certificate     /etc/nginx/certs/heim-ki.pem;
    ssl_certificate_key /etc/nginx/certs/heim-ki-key.pem;

    satisfy all;
    allow <LAN-CIDR>;
    deny  all;
    auth_basic           "Heim-KI Ollama";
    # macOS (Homebrew): Pfad auf /opt/homebrew/etc/nginx/heim-ki.htpasswd anpassen
    auth_basic_user_file /etc/nginx/heim-ki.htpasswd;

    location / {
        # Die Workstation lauscht nur auf ihrem eigenen Loopback und legt den
        # Port per SSH-Reverse-Tunnel hierher (siehe scripts/launchd/
        # de.heim-ki.ollama-tunnel.plist). Steht der Tunnel nicht, weil das
        # Notebook aus oder unterwegs ist, gibt es hier 502 — so gewollt.
        proxy_pass http://127.0.0.1:11435;
        proxy_set_header Authorization "";
        proxy_set_header Host 127.0.0.1:11434;   # s. o.
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
