# Heim-KI: Ollama + Open WebUI (+ Docling für RAG, Profil "rag")
#
# Start:            cp .env.example .env   # anpassen, dann:
#                   docker compose up -d
# Mit RAG-Extraktion (Docling):
#                   docker compose --profile rag up -d
#
# Image-Versionen und Tuning werden über die .env gesteuert (siehe .env.example).
# Die Ports sind bewusst nur an 127.0.0.1 gebunden — der NGINX auf dem Host
# (nginx/heim-ki.conf) ist der einzige Eingang aus dem LAN.

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.1}
    container_name: ollama
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Modelle nach Gebrauch eine Weile im VRAM halten statt sofort entladen:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Bei 4 GB VRAM: nur 1 Modell gleichzeitig geladen halten (Chat- und
      # Embedding-Modell wechseln sich dann ab, statt sich das VRAM zu teilen):
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.1}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - OLLAMA_BASE_URL=http://ollama:11434
      # Muss beim ersten Start "true" sein, sonst lässt sich der Admin-Account
      # gar nicht anlegen. Danach in den ADMIN-EINSTELLUNGEN abschalten — ein
      # späteres ENABLE_SIGNUP=false in der .env bleibt wirkungslos, weil Open
      # WebUI diesen Wert nur beim allerersten Start aus der Umgebung liest und
      # ihn danach aus der Datenbank nimmt.
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      # Neue Konten landen auf "ausstehend" und müssen freigegeben werden —
      # damit ist eine offene Registrierung für sich genommen harmlos:
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
    # Macht den Docker-Host unter "host.docker.internal" auflösbar (unter
    # Linux nicht automatisch der Fall, anders als bei Docker Desktop) —
    # nötig, damit Open WebUI die Workstation über den zweiten SSH-Tunnel-
    # Listener auf der Bridge-Gateway-Adresse erreicht (Tutorial §5/§6):
    # http://host.docker.internal:11435
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Dokumenten-Extraktion für RAG (README §7). Startet nur mit Profil "rag".
  # Open WebUI erreicht den Container über das Compose-Netz unter
  # http://docling:5001 — ein ports-Eintrag ist dafür nicht nötig.
  docling:
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve:v1.31.0}
    container_name: docling
    restart: unless-stopped
    profiles: ["rag"]
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Open WebUI konvertiert synchron (POST /v1/convert/file) und wartet ohne
      # eigenes Timeout. docling-serve gibt so einem Aufruf per Default nur
      # 120 s und antwortet danach mit 504 — für umfangreiche gescannte PDFs
      # mit OCR viel zu knapp:
      - DOCLING_SERVE_MAX_SYNC_WAIT=${DOCLING_SERVE_MAX_SYNC_WAIT:-3600}
      # Thread-Zahl für Layout und OCR. Der Image-Default 4 lässt Leistung
      # liegen, mehr als 6 kostet welche — Messwerte in der .env.example:
      - OMP_NUM_THREADS=${DOCLING_OMP_THREADS:-6}
    # Zum Testen vom Host aus bei Bedarf einkommentieren:
    # ports:
    #   - "127.0.0.1:5001:5001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5001/health || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Vektordatenbank für die eigene RAG-Pipeline (README §7, Variante B).
  # Der Indexer auf dem Host schreibt über 127.0.0.1:${CHROMA_HOST_PORT}, das
  # Open-WebUI-Tool (tools/heim_docs_suche.py) liest über das Compose-Netz
  # (http://chroma:8000) und ist vom Host-Port unabhängig.
  # Eigenes Profil "rag-batch": Variante B braucht Chroma, aber kein Docling.
  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.9}
    container_name: chroma
    restart: unless-stopped
    profiles: ["rag-batch"]
    environment:
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chroma-data:/data
    ports:
      # Host-Port über die .env umlegbar, falls 8000 schon belegt ist (ein
      # anderer Container auf 0.0.0.0:8000 blockiert auch dieses 127.0.0.1!).
      # Wird er geändert, muss CHROMA_URL des Indexers mitziehen — siehe
      # scripts/systemd/rag-indexer.service bzw. die launchd-plist.
      - "127.0.0.1:${CHROMA_HOST_PORT:-8000}:8000"
    healthcheck:
      # TCP-Check via bash, Fallback curl — je nachdem, was das Image mitbringt
      test:
        [
          "CMD-SHELL",
          "bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || curl -fsS http://localhost:8000/api/v2/heartbeat",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# Feste Volume-Namen (statt des Compose-Präfixes "<projektname>_"), damit
# Backup/Restore (scripts/backup.sh, README §11) die Volumes eindeutig findet:
volumes:
  ollama-data:
    name: ollama-data
  open-webui-data:
    name: open-webui-data
  chroma-data:
    name: chroma-data
