# Heim-KI: Ollama + Open WebUI (+ Docling für RAG, Profil "rag")
#
# Start:            cp .env.example .env   # anpassen, dann:
#                   docker compose up -d
# Mit RAG-Extraktion (Docling):
#                   docker compose --profile rag up -d
#
# Image-Versionen und Tuning werden über die .env gesteuert (siehe .env.example).
# Die Ports sind bewusst nur an 127.0.0.1 gebunden — der NGINX auf dem Host
# (nginx/heim-ki.conf) ist der einzige Eingang aus dem LAN.

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.1}
    container_name: ollama
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # Modelle nach Gebrauch eine Weile im VRAM halten statt sofort entladen:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Bei 4 GB VRAM: nur 1 Modell gleichzeitig geladen halten (Chat- und
      # Embedding-Modell wechseln sich dann ab, statt sich das VRAM zu teilen):
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.1}
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - OLLAMA_BASE_URL=http://ollama:11434
      # Nach dem Anlegen des Admin-Accounts in der .env auf "false" setzen
      # (oder alternativ in den Admin-Einstellungen die Standardrolle neuer
      # Nutzer auf "Ausstehend" stellen):
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Dokumenten-Extraktion für RAG (README §7). Startet nur mit Profil "rag".
  # Open WebUI erreicht den Container über das Compose-Netz unter
  # http://docling:5001 — ein ports-Eintrag ist dafür nicht nötig.
  docling:
    image: ${DOCLING_IMAGE:-ghcr.io/docling-project/docling-serve:v1.31.0}
    container_name: docling
    restart: unless-stopped
    profiles: ["rag"]
    environment:
      - TZ=${TZ:-Europe/Berlin}
    # Zum Testen vom Host aus bei Bedarf einkommentieren:
    # ports:
    #   - "127.0.0.1:5001:5001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5001/health || python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  ollama-data:
  open-webui-data:
